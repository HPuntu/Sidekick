name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run sync:version
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm run package
      - run: unzip -l dist/obsidian-sidekick-$(node -p "require('./manifest.json').version").zip
