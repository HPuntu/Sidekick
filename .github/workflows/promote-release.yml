name: Promote Release

on:
  push:
    branches: [main]

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Decide version bump
        id: bump
        run: |
          RANGE="${{ github.event.before }}..${{ github.sha }}"
          COMMITS=$(git log --format=%B "$RANGE" 2>/dev/null || git log -1 --format=%B)
          if echo "$COMMITS" | grep -Eiq 'BREAKING CHANGE|\[major\]|#major'; then
            BUMP=major
          elif echo "$COMMITS" | grep -Eiq '\[minor\]|#minor|feat(\(.+\))?:'; then
            BUMP=minor
          else
            BUMP=patch
          fi
          echo "type=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "Selected ${BUMP} release bump"

      - name: Bump version
        run: |
          NEXT_VERSION=$(node scripts/next-release-version.mjs "${{ steps.bump.outputs.type }}")
          npm version "${NEXT_VERSION}" --no-git-tag-version
          npm run sync:version

      - name: Update changelog
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            RELEASE_COMMITS=$(git log --pretty="- %s (%h)" "${LAST_TAG}..${{ github.sha }}")
          else
            RELEASE_COMMITS=$(git log --pretty="- %s (%h)")
          fi
          VERSION="$VERSION" RELEASE_DATE="$RELEASE_DATE" RELEASE_COMMITS="$RELEASE_COMMITS" node <<'NODE'
          const fs = require("fs");

          const version = process.env.VERSION;
          const releaseDate = process.env.RELEASE_DATE;
          const releaseCommits = (process.env.RELEASE_COMMITS || "").trim();
          const changelogPath = "CHANGELOG.md";
          const source = fs.existsSync(changelogPath)
            ? fs.readFileSync(changelogPath, "utf8").replace(/\r\n/g, "\n")
            : "";
          const lines = source.split("\n");
          const unreleasedStart = lines.findIndex((line) => /^##\s+Unreleased\s*$/i.test(line.trim()));
          let unreleasedNotes = "";

          if (unreleasedStart >= 0) {
            let unreleasedEnd = lines.length;
            for (let index = unreleasedStart + 1; index < lines.length; index += 1) {
              if (/^##\s+/.test(lines[index])) {
                unreleasedEnd = index;
                break;
              }
            }
            unreleasedNotes = lines.slice(unreleasedStart + 1, unreleasedEnd).join("\n").trim();
            lines.splice(unreleasedStart, unreleasedEnd - unreleasedStart);
          }

          let existing = lines.join("\n").trim();
          const headingMatch = existing.match(/^#\s+Changelog\s*\n+/i);
          const heading = headingMatch ? headingMatch[0].trim() : "";
          if (headingMatch) {
            existing = existing.slice(headingMatch[0].length).trim();
          }

          const releaseNotes = unreleasedNotes || releaseCommits || "- Release maintenance update.";
          const nextSections = [];
          if (heading) {
            nextSections.push(heading, "");
          }
          nextSections.push(
            "## Unreleased",
            "",
            `## ${version} - ${releaseDate}`,
            "",
            releaseNotes,
            ""
          );
          if (existing) {
            nextSections.push(existing);
          }

          const next = nextSections.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
          fs.writeFileSync(changelogPath, next);
          NODE

      - run: npm run release:check

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Commit version update
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          git add package.json package-lock.json manifest.json versions.json CHANGELOG.md
          git commit -m "Release ${VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${VERSION}"; then
            echo "Tag ${VERSION} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          git tag "${VERSION}"

      - name: Push commit and tag
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          git push origin HEAD:main
          git push origin "${VERSION}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          gh release create "${VERSION}" \
            main.js \
            manifest.json \
            styles.css \
            --title "${VERSION}" \
            --notes-file CHANGELOG.md
